# Default configuration for the available roles

# minimal defaults for fast testing - copy local.yml.sample or everything.yml
# to local.yml and adjust as needed
initial_setup: false
install_graphics: false
docker: true # for rootful this needs to happen before first reboot
catrust: false
phoebus: false
oac_tree: false
archiver_appliance: false
bluesky: false

# RAPIDS roles (off by default, enable them in local.yml)
system_time: false
olog_server: false
olog_client_config: false
archiver_client_config: false
rapids_landing_page: true   # RAPIDS footer on the Archiver page (only with archiver_appliance)

m_base: true

is_debian: "{{ ansible_facts['os_family'] == 'Debian' }}"
is_redhat: "{{ ansible_facts['os_family'] == 'RedHat' }}"
dev_user: "epics-dev"

# Shared by any role that wants to add a link to the desktop homepage set up
# by initial_setup (roles/initial_setup/tasks/homepage.yml)
training_vm_homepage_dir: "/home/{{ dev_user }}/.local/share/training-vm-homepage"

# Default: false proxy
proxy_env: {}

# when building inside a container during CI this is set to true
in_container: false

# ---------------------------------------------------------------------------
# RAPIDS
# ---------------------------------------------------------------------------
# Hostname/IP used to build Archiver Appliance URLs for the Phoebus client
archappl_host: "{{ ansible_facts['default_ipv4']['address'] | default('localhost') }}"

# Project branding (shown in banners and generated documents)
rapids_project_name: "RAPIDS"
rapids_author_name: "Your Name"
rapids_author_email: "your.email@example.org"
rapids_institution: "Your Institution"
