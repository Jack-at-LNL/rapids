# ============================================================================
# RAPIDS - Olog Backup System Setup
# ============================================================================

# NOTE (2026-09-29): backup-now.sh / restore-backup.sh were removed. They only
# mongodump'd MongoDB + copied config, but Olog's olog-es client stores actual
# log-entry content in ElasticSearch (logbooks themselves are ES-backed too -
# confirmed: stopping ES makes GET /Olog/logbooks fail with 500), which the
# old scripts never touched at all. A real backup needs ElasticSearch's own
# snapshot API (path.repo + register repository + snapshot alongside
# mongodump), not a filesystem copy of a live cluster's data directory, which
# Elastic itself advises against. Proper fix is a separate, tracked task -
# do not reintroduce a backup script without an actually-tested restore path.

- name: Remove the old backup script if a previous run installed it
  file:
    path: "{{ olog_install_dir }}/scripts/backup-now.sh"
    state: absent
  become: yes

- name: Remove the old restore script if a previous run installed it
  file:
    path: "{{ olog_install_dir }}/scripts/restore-backup.sh"
    state: absent
  become: yes

- name: Remove the old backup cron job if a previous run installed it
  cron:
    name: "Olog daily backup"
    state: absent
  become: yes

- name: Remove the old backup cleanup cron job if a previous run installed it
  cron:
    name: "Olog backup cleanup"
    state: absent
  become: yes

- name: Create scripts directory
  file:
    path: "{{ olog_install_dir }}/scripts"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: yes

- name: Install manage-logbooks script
  template:
    src: scripts/manage-logbooks.sh.j2
    dest: "{{ olog_install_dir }}/scripts/manage-logbooks.sh"
    mode: '0755'
    owner: root
    group: root
  become: yes

- name: Install manage-tags script
  template:
    src: scripts/manage-tags.sh.j2
    dest: "{{ olog_install_dir }}/scripts/manage-tags.sh"
    mode: '0755'
    owner: root
    group: root
  become: yes

- name: Create README for scripts
  copy:
    content: |
      # Olog Maintenance Scripts

      Installed by RAPIDS Ansible deployment.

      ## Available Scripts

      - manage-logbooks.sh     - Logbook management (add/delete/list)
      - manage-tags.sh         - Tag management (add/delete/list)

      No backup system is currently installed - see doc/rapids/olog-server.md.

      ## Usage

      See doc/rapids/olog-server.md in the RAPIDS repository.
    dest: "{{ olog_install_dir }}/scripts/README.txt"
    mode: '0644'
  become: yes

- name: Display management scripts installed
  debug:
    msg:
      - "✅ Olog management scripts installed"
      - "Scripts: {{ olog_install_dir }}/scripts/"
      - "⚠️  No backup system is configured - see the note above install_olog tasks"

- name: Install the RAPIDS Olog healthcheck script
  copy:
    src: scripts/rapids_olog_healthcheck.sh
    dest: "{{ olog_install_dir }}/scripts/rapids_olog_healthcheck.sh"
    mode: '0755'
    owner: root
    group: root
  become: yes

# Non-interactive: OLOG_PASSWORD is passed via environment so the script
# never hits its interactive 'read -rs -p' prompt, which would hang here.
# --no-restart because restarting Olog mid-install is disruptive and O6a
# (restart persistence) is better exercised manually, later, if needed.
- name: Run the Olog healthcheck
  command: "bash {{ olog_install_dir }}/scripts/rapids_olog_healthcheck.sh --no-restart"
  environment:
    OLOG_PASSWORD: "{{ olog_admin_password }}"
  become: yes
  become_user: "{{ dev_user }}"
  register: olog_healthcheck_result
  changed_when: false
  failed_when: false

- name: Determine whether the Olog healthcheck failed
  set_fact:
    olog_healthcheck_failed: "{{ 'FAIL=0' not in (olog_healthcheck_result.stdout | default('')) }}"

- name: WARNING - Olog healthcheck failed
  when: olog_healthcheck_failed | bool
  debug:
    msg:
      - "Olog HEALTHCHECK reported failures - see the report above/below for details."
      - "The install is CONTINUING. See doc/rapids/olog-server.md, section Troubleshooting."
      - "{{ olog_healthcheck_result.stdout_lines[-6:] }}"

- name: Report the Olog healthcheck result
  when: not (olog_healthcheck_failed | bool)
  debug:
    msg: "{{ olog_healthcheck_result.stdout_lines[-3:] }}"
