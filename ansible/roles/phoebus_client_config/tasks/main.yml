# ============================================================================
# RAPIDS - Phoebus Client Configuration
# Configures BOTH Olog logbook AND Archiver Appliance data browser
# Single source of truth: local.yml
# ============================================================================

- name: Display Phoebus client configuration start
  debug:
    msg: 
      - "Configuring Phoebus for:"
      - "  Olog: {{ olog_server_url if (olog_client_config | default(false)) else 'disabled' }}"
      - "  Archiver: {{ archappl_host if (archiver_client_config | default(false)) else 'disabled' }}"

- name: Check if Phoebus settings.ini exists
  stat:
    path: "{{ phoebus_settings_file }}"
  register: settings_exists
  become: yes

- name: Create empty settings.ini if missing
  copy:
    content: |
      # Phoebus Settings - RAPIDS/INFN LNL
      # Generated by RAPIDS Ansible automation
      
    dest: "{{ phoebus_settings_file }}"
    owner: "{{ phoebus_user }}"
    group: "{{ phoebus_group }}"
    mode: '0644'
  become: yes
  when: not settings_exists.stat.exists

- name: Display settings.ini status
  debug:
    msg: "Settings file {{ 'already exists' if settings_exists.stat.exists else 'created' }} at {{ phoebus_settings_file }}"

# ============================================================================
# CLEANUP OLD CONFIGURATION (if cleanup.yml exists)
# ============================================================================

- name: Check if cleanup tasks exist
  stat:
    path: "{{ role_path }}/tasks/cleanup.yml"
  register: cleanup_exists
  delegate_to: localhost

- name: Cleanup existing configuration
  include_tasks: cleanup.yml
  when: cleanup_exists.stat.exists and (phoebus_client_cleanup | default(false) | bool)
  tags:
    - cleanup

# ============================================================================
# OLOG CONFIGURATION
# ============================================================================

- name: Configure Olog logbook
  block:
    - name: Extract logbooks from local.yml
      set_fact:
        phoebus_logbooks: "{{ olog_initial_logbooks | default([]) | map(attribute='name') | list | join(',') }}"

    - name: Extract tags from local.yml
      set_fact:
        phoebus_tags: "{{ olog_initial_tags | default([]) | map(attribute='name') | list | join(',') }}"

    - name: Set levels
      set_fact:
        phoebus_levels: "Info,Warning,Urgent,Critical,Routine"

    - name: Configure Olog in settings.ini
      blockinfile:
        path: "{{ phoebus_settings_file }}"
        marker: "# {mark} OLOG CONFIGURATION - MANAGED BY ANSIBLE"
        create: yes
        block: |
          # Logbook: the Olog server (preference names as defined in the Phoebus source)
          org.phoebus.logbook/logbook_factory=olog-es
          org.phoebus.olog.es.api/olog_url={{ olog_server_url }}
          org.phoebus.olog.es.api/levels={{ phoebus_levels }}
          org.phoebus.logbook.olog.ui/default_logbooks={{ olog_default_logbooks }}
          org.phoebus.logbook.olog.ui/default_logbook_query={{ phoebus_logbook_default_query }}
          # Users log in with their own Olog account; Phoebus may remember it
          org.phoebus.ui/save_credentials=true
        owner: "{{ phoebus_user }}"
        group: "{{ phoebus_group }}"
        mode: '0644'
      become: yes

    - name: Display Olog configuration complete
      debug:
        msg:
          - "✅ Olog logbook configured"
          - "Server: {{ olog_server_url }}"
          - "Logbooks: {{ phoebus_logbooks }}"
          - "Tags: {{ olog_initial_tags | length if olog_initial_tags is defined else 0 }}"
  when: olog_client_config | default(false)

# ============================================================================
# ARCHIVER CONFIGURATION
# ============================================================================

- name: Configure Archiver Appliance
  block:
    - name: Set archiver retrieval URL
      set_fact:
        archiver_retrieval_url: "pbraw://{{ archappl_host }}:17665/retrieval"

    - name: Configure Archiver in settings.ini
      blockinfile:
        path: "{{ phoebus_settings_file }}"
        marker: "# {mark} ARCHIVER CONFIGURATION - MANAGED BY ANSIBLE"
        create: yes
        block: |
          # Archiver Appliance - Data Browser Configuration
          org.csstudio.trends.databrowser3/urls={{ archiver_retrieval_url }}
          org.csstudio.trends.databrowser3/archives={{ archiver_retrieval_url }}
          org.csstudio.trends.databrowser3/use_default_archives=true
        owner: "{{ phoebus_user }}"
        group: "{{ phoebus_group }}"
        mode: '0644'
      become: yes

    - name: Display Archiver configuration complete
      debug:
        msg:
          - "✅ Archiver data browser configured"
          - "Server: {{ archappl_host }}:17665"
          - "Retrieval URL: {{ archiver_retrieval_url }}"
  when: archiver_client_config | default(false)

# ============================================================================
# SUMMARY
# ============================================================================

- name: Display complete configuration summary
  debug:
    msg:
      - "✅ Phoebus configured from local.yml"
      - "Olog logbook: {{ 'enabled' if (olog_client_config | default(false)) else 'disabled' }}"
      - "Archiver browser: {{ 'enabled' if (archiver_client_config | default(false)) else 'disabled' }}"
      - "Settings: {{ phoebus_settings_file }}"
