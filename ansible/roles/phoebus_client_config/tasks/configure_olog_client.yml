---
# Configure Olog client in Phoebus settings.ini

- name: Check if Olog configuration section exists in settings.ini
  shell: grep -q "org.phoebus.olog.es.api/olog_url" {{ phoebus_settings_file }}
  register: olog_section_exists
  ignore_errors: yes
  changed_when: false

- name: Add Olog configuration section header if not exists
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    line: |
      
      # ============================================
      # OLOG ELECTRONIC LOGBOOK CONFIGURATION
      # ============================================
    insertafter: EOF
    state: present
  become: yes
  when: olog_section_exists.rc != 0

- name: Configure Olog server URL
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    regexp: '^org.phoebus.olog.es.api/olog_url='
    line: "org.phoebus.olog.es.api/olog_url={{ olog_server_url }}"
    insertafter: "# OLOG ELECTRONIC LOGBOOK CONFIGURATION"
    state: present
  become: yes

- name: Configure Olog username
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    regexp: '^org.phoebus.olog.es.api/username='
    line: "org.phoebus.olog.es.api/username={{ olog_username }}"
    insertafter: "org.phoebus.olog.es.api/olog_url"
    state: present
  become: yes

- name: Configure Olog password
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    regexp: '^org.phoebus.olog.es.api/password='
    line: "org.phoebus.olog.es.api/password={{ olog_password }}"
    insertafter: "org.phoebus.olog.es.api/username"
    state: present
  become: yes
  no_log: true

- name: Configure logbooks list
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    regexp: '^org.phoebus.applications.logbook.ui/logbooks='
    line: "org.phoebus.applications.logbook.ui/logbooks={{ olog_logbooks_list | join(',') }}"
    insertafter: "org.phoebus.olog.es.api/password"
    state: present
  become: yes
  when: olog_logbooks_list | length > 0

- name: Configure default logbooks
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    regexp: '^org.phoebus.applications.logbook.ui/default_logbooks='
    line: "org.phoebus.applications.logbook.ui/default_logbooks={{ olog_default_logbooks }}"
    insertafter: "org.phoebus.applications.logbook.ui/logbooks"
    state: present
  become: yes

- name: Configure tags list
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    regexp: '^org.phoebus.applications.logbook.ui/tags='
    line: "org.phoebus.applications.logbook.ui/tags={{ olog_tags_list | join(',') }}"
    insertafter: "org.phoebus.applications.logbook.ui/default_logbooks"
    state: present
  become: yes
  when: olog_tags_list | length > 0

- name: Configure levels list
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    regexp: '^org.phoebus.applications.logbook.ui/levels='
    line: "org.phoebus.applications.logbook.ui/levels={{ olog_levels_list | join(',') }}"
    insertafter: "org.phoebus.applications.logbook.ui/tags"
    state: present
  become: yes

- name: Configure save credentials option
  lineinfile:
    path: "{{ phoebus_settings_file }}"
    regexp: '^org.phoebus.applications.logbook.ui/save_credentials='
    line: "org.phoebus.applications.logbook.ui/save_credentials={{ olog_save_credentials | lower }}"
    insertafter: "org.phoebus.applications.logbook.ui/levels"
    state: present
  become: yes

- name: Display configuration summary
  debug:
    msg:
      - "Olog configuration added to {{ phoebus_settings_file }}"
      - "Logbooks configured: {{ olog_logbooks_list | length }}"
      - "Tags configured: {{ olog_tags_list | length }}"
      - "Levels configured: {{ olog_levels_list | length }}"
