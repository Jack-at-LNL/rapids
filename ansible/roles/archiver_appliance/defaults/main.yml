---
# Defaults for tomcat and archiver-appliance

tomcat_home: "/opt/epics-tools/lib/tomcat"
tomcat_version: "9.0.79"
tomcat_user: tomcat
tomcat_group: tomcat

archiver_appliance_version: "2.0.7"

archiver_appliance_id: "appliance0"
archiver_appliance_storage: "{{ tomcat_home }}/storage"

# JAVA options
archiver_appliance_java_maxmetaspace: "256M"
archiver_appliance_java_initial_heapsize: "512M"
archiver_appliance_java_max_heapsize: "512M"
archiver_appliance_java_heap_tuning_opts: "-XX:MaxHeapFreeRatio=10 -XX:MinHeapFreeRatio=5 -XX:-ShrinkHeapInSteps"

# --- Training-VM homepage link ---
archiver_homepage_link_title: "Archiver"
archiver_homepage_link_url: "http://localhost:17665/mgmt/ui/index.html"

# Address the Archiver gives to clients (browsers, Phoebus) in appliances.xml.
# 'localhost' works only on this machine; RAPIDS sets archappl_host
# (group_vars/all.yml) to the machine address so that other machines work too.
archiver_appliance_host: "{{ archappl_host | default('localhost') }}"
archiver_appliance_http_port: 17665
archiver_appliance_base_url: "http://{{ archiver_appliance_host }}:{{ archiver_appliance_http_port }}"
# Cluster address: a single appliance talks only to itself
archiver_appliance_cluster_inetport: "localhost:16670"
# Archiving policies file (in files/); RAPIDS uses rapids-policies.py
archiver_appliance_policies_file: "policies.py"
