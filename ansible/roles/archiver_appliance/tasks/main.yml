---
# Download and install the archiver appliance
- name: Install and configure MariaDB
  ansible.builtin.include_tasks:
    file: install_mariadb.yml

- name: Check if Tomcat installation exists
  become: true
  ansible.builtin.stat:
    path: "{{ tomcat_home }}/bin"
  register: tomcat_installation
  changed_when: false

- name: Download and install Tomcat
  ansible.builtin.include_tasks:
    file: install_tomcat.yml
  when: tomcat_installation.stat.exists == false

- name: Check if Archiver Appliance installation exists
  become: true
  ansible.builtin.stat:
    path: "{{ tomcat_home }}/webapps/mgmt"
  register: archiver_appliance_installation
  changed_when: false

- name: Download and install the Archiver Appliance
  ansible.builtin.include_tasks:
    file: install_appliance.yml
  when: archiver_appliance_installation.stat.exists == false

- name: Ensure storage and configuration directories exist
  become: true
  ansible.builtin.file:
    path: "{{ tomcat_home }}/{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
  loop:
    - storage/sts
    - storage/mts
    - storage/lts
    - archappl_conf

- name: Configure Archiver Appliance - appliances.xml
  become: true
  ansible.builtin.template:
    src: appliances.xml.j2
    dest: "{{ tomcat_home }}/archappl_conf/appliances.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0644"
  notify:
    - Restart archiver-appliance

- name: Configure Archiver Appliance - policies.py
  become: true
  ansible.builtin.copy:
    src: "{{ archiver_appliance_policies_file }}"
    dest: "{{ tomcat_home }}/archappl_conf/policies.py"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0644"
  notify:
    - Restart archiver-appliance

- name: Set the archappl.properties
  become: true
  ansible.builtin.template:
    src: archappl.properties.j2
    dest: "{{ tomcat_home }}/webapps/archappl.properties"
    owner: root
    group: "{{ tomcat_group }}"
    mode: "0640"
  notify:
    - Restart archiver-appliance

- name: Create Tomcat setenv.sh script
  become: true
  ansible.builtin.template:
    src: setenv.sh.j2
    dest: "{{ tomcat_home }}/bin/setenv.sh"
    owner: root
    group: "{{ tomcat_group }}"
    mode: "0644"
  notify:
    - Restart archiver-appliance

- name: Check if we have set up the archiver tables
  community.mysql.mysql_query:
    login_db: archappl
    login_user: archappl
    login_password: archappl
    query: show tables
  register: tables

- name: Run the Archiver-Appliance's MariaDB install script
  ansible.builtin.shell:
    cmd: "mariadb -u archappl --password=archappl archappl < {{ tomcat_home }}/webapps/mgmt/install/archappl_mysql.sql"
  when: "tables.rowcount[0] == 0"

# Safety net (old RAPIDS, production incident of 5 Mar 2026): under MariaDB strict mode
# a NOT NULL 'appliance' column without default rejects the Archiver's inserts,
# PVTypeInfo stays empty and every restart loses all PVs. Idempotent.
- name: Make PVTypeInfo.appliance nullable (MariaDB strict mode)
  community.mysql.mysql_query:
    login_db: archappl
    login_user: archappl
    login_password: archappl   # audit: allow - Ralph's default, to become a setting
    query: ALTER TABLE PVTypeInfo MODIFY COLUMN appliance VARCHAR(64) DEFAULT NULL
  failed_when: false
  changed_when: false

- name: Create Archiver Appliance systemd service
  become: true
  ansible.builtin.template:
    src: archiver_appliance.service.j2
    dest: /etc/systemd/system/archiver-appliance.service
    owner: root
    group: root
    mode: "0644"

- name: Manage Archiver Appliance service
  become: true
  when: not in_container
  ansible.builtin.systemd_service:
    name: archiver-appliance
    state: started
    enabled: true
    daemon_reload: true

- name: Add Archiver Appliance link to the Training-VM homepage
  when: not in_container and install_graphics | bool
  ansible.builtin.include_tasks:
    file: add_homepage_link.yml
